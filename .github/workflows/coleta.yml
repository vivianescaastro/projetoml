name: Coleta de leilões

on:
  workflow_dispatch:   # só manual: aba Actions > Coleta de leilões > Run workflow
    inputs:
      branch:
        description: "Branch com o código da coleta (e onde o resultado é gravado)"
        required: true
        default: "claude/phantom-playwright-automation-hfsa6w"

permissions:
  contents: write

concurrency:
  group: coleta-leiloes
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: coleta/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r coleta/requirements.txt
          playwright install --with-deps chromium

      - name: Coletar leilões e gerar a página
        run: python coleta/receita_leiloes.py

      - name: Guardar a página como arquivo da execução
        uses: actions/upload-artifact@v4
        with:
          name: pagina-leiloes
          path: |
            docs/index.html
            data/historico.json

      - name: Gravar histórico e página no repositório
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "coleta-leiloes[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Sem mudanças para gravar."
          else
            git commit -m "Atualiza coleta de leilões"
            git pull --rebase origin "${BRANCH}"
            git push origin "HEAD:${BRANCH}"
          fi
