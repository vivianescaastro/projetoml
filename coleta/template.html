<title>Filtro Leilões Receita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: painel único, resumo no topo, editais em cartões, tabela de lotes filtrável.
   Identidade herdada do LeilãoIA: grafite escuro com laranja de decisão e verde de concluído. */
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1d212a;--line:#2a2f3a;--tx:#e8eaf0;--mut:#9aa3b2;--acc:#f08a24;--accfg:#111;--ok:#2fbf71;--okbg:#12301f;--warn:#e6a817;--warnbg:#33280d;--info:#4c8dff;color-scheme:dark;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f7f9;--panel:#fff;--panel2:#eef1f5;--line:#d6dbe3;--tx:#1a1f29;--mut:#5b6474;--acc:#c9680a;--accfg:#fff;--ok:#1b8a4b;--okbg:#e3f5ea;--warn:#a87400;--warnbg:#fbf0d4;--info:#2f6fd6;color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f7f9;--panel:#fff;--panel2:#eef1f5;--line:#d6dbe3;--tx:#1a1f29;--mut:#5b6474;--acc:#c9680a;--accfg:#fff;--ok:#1b8a4b;--okbg:#e3f5ea;--warn:#a87400;--warnbg:#fbf0d4;--info:#2f6fd6;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;display:grid;gap:16px}
h1{font-size:22px;margin:0;text-wrap:balance}h1 b{color:var(--acc)}
h2{font-size:16px;margin:0 0 12px;text-wrap:balance}
.mut{color:var(--mut)}.num{font-variant-numeric:tabular-nums}
.top{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{display:block;color:var(--mut);font-size:12px}.kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--tx)}
.eds{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.ed{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.ed h3{margin:0;font-size:14.5px;font-family:var(--mono);overflow-wrap:anywhere}
.ed .cid{font-size:19px;font-weight:700;margin-right:6px}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;width:max-content;border:1px solid var(--line)}
.badge.ab{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.badge.di{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.ed dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.ed dt{color:var(--mut)}.ed dd{margin:0;font-variant-numeric:tabular-nums}
.btn{display:inline-block;font:inherit;font-size:13px;font-weight:600;text-decoration:none;color:var(--accfg);background:var(--acc);border:0;border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.sec{background:var(--panel);color:var(--tx);border:1px solid var(--line);font-weight:500}
.btn:focus-visible,select:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.ctl label{display:grid;gap:3px;font-size:12px;color:var(--mut);min-width:0}
select,input[type=search]{font:inherit;font-size:14px;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
button.chip{cursor:pointer;font:inherit;font-size:12px}
button.chip[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px;white-space:nowrap;background:var(--panel2);position:sticky;top:0}
th.r,td.r{text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td a{color:var(--info);text-decoration:none;font-weight:600}td a:hover{text-decoration:underline}
.sit-ab{color:var(--ok)}.sit-di{color:var(--warn)}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--mut);font-size:13.5px}
.tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;border:1px solid var(--line);white-space:nowrap}
.tag.nv{color:var(--ok);border-color:var(--ok);background:var(--okbg)}.tag.al{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}.tag.sx{color:var(--mut)}
.empty{padding:22px;text-align:center;color:var(--mut)}
</style>

<div class="wrap">
  <div class="top"><h1>Leilões <b>Receita Federal</b> · resultado do filtro</h1><span class="mut num" id="gen"></span></div>
  <div class="note" id="run"></div>

  <section class="card">
    <h2>Filtro aplicado no portal</h2>
    <div class="chips" id="filtros"></div>
    <div class="kpis" style="margin-top:14px" id="kpis"></div>
  </section>

  <section class="card"><h2>Editais encontrados</h2><div class="eds" id="eds"></div></section>

  <section class="card">
    <h2>Lotes</h2>
    <div class="ctl">
      <label>Edital<select id="fEd"></select></label>
      <label>Situação<select id="fSit"><option value="">Todas</option><option>Aberto para Proposta</option><option>Disponibilizado</option></select></label>
      <label>Mostrar<select id="fMos"><option value="ativos">Ativos</option><option value="novos">Novos na última coleta</option><option value="alt">Mudaram de preço/situação</option><option value="saiu">Saíram do portal</option></select></label>
      <label>Ordenar<select id="fOrd"><option value="asc">Menor preço</option><option value="desc">Maior preço</option><option value="lote">Número do lote</option></select></label>
      <label>Buscar tipo<input type="search" id="fQ" placeholder="ex.: celular"></label>
    </div>
    <div class="chips" id="tipos" role="group" aria-label="Tipos de lote" style="margin-bottom:12px"></div>
    <div class="tbl"><table><thead><tr><th>Lote</th><th>Edital</th><th>Tipo</th><th>Situação</th><th class="r">Preço mínimo</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="foot"><span class="mut" id="cnt"></span><button class="btn sec" id="more" hidden>Mostrar mais</button></div>
  </section>
</div>

<script>
const H=__DATA__;
const BASE='https://www25.receita.fazenda.gov.br';
const $=s=>document.querySelector(s);
const brl=v=>v==null?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const short=n=>{const m=/^(\d+)\/0*(\d+)\/(\d{4})\s*(.*)$/.exec(n);return m?{num:`${+m[2]}/${m[3]}`,cid:m[4]}:{num:n,cid:''}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ultima=H.ultima_execucao, ex=H.execucoes[H.execucoes.length-1]||{};
const D={editais:Object.values(H.editais).filter(e=>e.ativo).map((e,i)=>({...e,i,s:short(e.edital),lotes:[]}))};
const byName=Object.fromEntries(D.editais.map(e=>[e.edital,e]));
const todos=[];
Object.values(H.lotes).forEach(r=>{const e=byName[r.edital];if(!e&&r.ativo)return;const l={...r,e:e||{i:-1,s:short(r.edital),href:''},tipos:r.tipo.split(',').map(t=>t.trim())};todos.push(l);if(e&&r.ativo)e.lotes.push(l)});
D.editais.forEach(e=>{e.aberto=e.lotes.length>0&&e.lotes.every(l=>l.situacao==='Aberto para Proposta')});
const all=todos.filter(l=>l.ativo);
$('#gen').textContent='coleta de '+ultima.slice(0,16);
$('#run').innerHTML=`Última coleta <b>${esc(ultima.slice(0,16))}</b> (horário de Brasília): ${ex.editais} editais, ${ex.lotes} lotes · <b>${ex.novos}</b> novos, <b>${ex.alterados}</b> alterados, <b>${ex.saiu}</b> saíram. Coletas registradas: ${H.execucoes.length}. Para atualizar, rode o fluxo "Coleta de leilões" na aba Actions do GitHub.`;
$('#filtros').innerHTML=H.filtros.ufs.map(u=>`<span class="chip">UF · ${esc(u)}</span>`).join('')+`<span class="chip">Tipo · ${esc(H.filtros.tipos)}</span>`;
const cel=all.filter(l=>l.tipos.some(t=>/CELULAR/.test(t)));
const celAb=cel.filter(l=>l.situacao==='Aberto para Proposta');
$('#kpis').innerHTML=[['Editais',D.editais.length],['Lotes',all.length],['Editais abertos',D.editais.filter(e=>e.aberto).length],['Lotes de celular',cel.length],['Celular aberto p/ proposta',celAb.length]].map(([a,b])=>`<div class="kpi"><small>${a}</small><b>${b}</b></div>`).join('');
$('#eds').innerHTML=D.editais.map(e=>{const c=e.lotes.filter(l=>/CELULAR/.test(l.tipo)).length;
 return `<article class="ed"><span class="badge ${e.aberto?'ab':'di'}">${e.aberto?'ABERTO PARA PROPOSTA':'DISPONIBILIZADO'}</span>
 <h3><span class="cid">${esc(e.s.cid)}</span>${esc(e.s.num)}</h3>
 <dl><dt>Propostas até</dt><dd>${esc(e.propostas_ate)}</dd><dt>Lances</dt><dd>${esc(e.lances)}</dd><dt>Lotes no filtro</dt><dd>${e.lotes.length}</dd><dt>Com celular</dt><dd>${c}</dd><dt>Edital em PDF</dt><dd>${e.pdf?`<a href="${esc(e.pdf)}" target="_blank" rel="noopener">baixar PDF</a>`:'não baixado'}</dd></dl>
 <div><a class="btn sec" href="${BASE+esc(e.href)}" target="_blank" rel="noopener">Abrir no portal</a></div></article>`}).join('');
$('#fEd').innerHTML='<option value="">Todos</option>'+D.editais.map(e=>`<option value="${e.i}">${esc(e.s.cid)} · ${esc(e.s.num)}</option>`).join('');
const cnt={};all.forEach(l=>l.tipos.forEach(t=>cnt[t]=(cnt[t]||0)+1));
const tipos=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);const sel=new Set();
$('#tipos').innerHTML=tipos.map(([t,n])=>`<button type="button" class="chip" aria-pressed="false" data-t="${esc(t)}">${esc(t)} · ${n}</button>`).join('');
$('#tipos').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const t=b.dataset.t;sel.has(t)?sel.delete(t):sel.add(t);b.setAttribute('aria-pressed',sel.has(t));lim=50;draw()});
let lim=50;
function draw(){
 const ed=$('#fEd').value,st=$('#fSit').value,q=$('#fQ').value.trim().toLowerCase(),o=$('#fOrd').value;
 const mo=$('#fMos').value;const base=mo==='saiu'?todos.filter(l=>!l.ativo):mo==='novos'?all.filter(l=>l.novo_na_execucao===ultima&&H.execucoes.length>1):mo==='alt'?all.filter(l=>l.alterado_na_execucao===ultima):all;
 let L=base.filter(l=>(ed===''||l.e.i==ed||mo==='saiu')&&(!st||l.situacao===st)&&(!q||l.tipo.toLowerCase().includes(q))&&(!sel.size||l.tipos.some(t=>sel.has(t))));
 const n=s=>+/\d+/.exec(s.lote)[0];
 L.sort(o==='lote'?(a,b)=>a.e.i-b.e.i||n(a)-n(b):o==='desc'?(a,b)=>(b.preco_minimo??0)-(a.preco_minimo??0):(a,b)=>(a.preco_minimo??1e12)-(b.preco_minimo??1e12));
 $('#rows').innerHTML=L.length?L.slice(0,lim).map(l=>`<tr><td><a href="${BASE+esc(l.href)}" target="_blank" rel="noopener">${esc(l.lote)}</a></td><td>${esc(l.e.s.cid)} <span class="mut">${esc(l.e.s.num)}</span></td><td>${esc(l.tipo)}${l.ativo&&l.novo_na_execucao===ultima&&H.execucoes.length>1?'<span class="tag nv">NOVO</span>':''}${l.alterado_na_execucao===ultima?'<span class="tag al">ALTEROU</span>':''}${!l.ativo?'<span class="tag sx">SAIU</span>':''}</td><td class="${l.situacao==='Aberto para Proposta'?'sit-ab':'sit-di'}">${esc(l.situacao)}</td><td class="r">${brl(l.preco_minimo)}${l.variacoes&&l.variacoes.length?`<div class="mut" style="font-size:11.5px">antes ${brl(l.variacoes[l.variacoes.length-1].preco_antes)}</div>`:''}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhum lote com esses filtros.</td></tr>';
 $('#cnt').textContent=`Mostrando ${Math.min(lim,L.length)} de ${L.length} lotes`;
 $('#more').hidden=L.length<=lim;
}
['#fEd','#fSit','#fOrd','#fMos'].forEach(s=>$(s).addEventListener('change',()=>{lim=50;draw()}));
$('#fQ').addEventListener('input',()=>{lim=50;draw()});
$('#more').addEventListener('click',()=>{lim+=100;draw()});
draw();
</script>
